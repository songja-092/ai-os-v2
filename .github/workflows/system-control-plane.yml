name: System Control Plane

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify-system-control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install state validation dependencies
        run: python -m pip install PyYAML jsonschema
      - name: Verify system state
        run: tests/test-system-state
      - name: Verify state and diagram alignment
        run: tests/test-system-diagram-sync
