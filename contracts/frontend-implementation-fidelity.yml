schema_version: "1.0"
contract_id: v2-frontend-implementation-fidelity
scope: ai-os-v2-system
excluded_products: [story_board]
principles:
  role_or_file_presence_is_sufficient: false
  extra_evidence_document_required: false
  new_library_or_agent_required: false
  objective_checks_before_human_judgment: true
current_stage: restore
next_stage: restore
final_stage: restore
stages:
  - id: control_plane
    label: 운영 기반
    status: completed
    work: SYSTEM_STATE와 단계·승인·복구 규칙을 모든 세션의 공통 기준으로 사용
    exit_condition: 공통 상태 검사와 복구 연습 통과
    user_intervention: none
  - id: fidelity_contract
    label: 공통 완성도 계약
    status: completed
    work: 시안 대비 화면·기능·오류·복구의 자동 판정 항목을 기계 판독형으로 고정
    exit_condition: 계약 스키마와 실패 Fixture 검사 통과
    user_intervention: none
  - id: isolated_fixture
    label: 격리 화면 시험
    status: completed
    work: 특정 제품과 분리된 V2 예제 화면에 공통 계약을 실제 적용
    exit_condition: 데스크톱·모바일 주요 작업과 오류 상태가 실행됨
    user_intervention: none
  - id: objective_validation
    label: 객관 검사
    status: completed
    work: 동일 Viewport의 목표·실제 화면과 기능·접근성·재시작 결과를 비교
    exit_condition: 필수 자동 검사 통과 후 사용자가 체감 결과를 확인
    user_intervention: final_experience_review
  - id: staging
    label: 배포 전 시험
    status: completed
    work: Production과 분리된 환경에서 배포 및 이전 Version 복구를 예행
    exit_condition: Staging 배포와 복구 모두 성공
    user_intervention: none
  - id: production
    label: 실제 배포
    status: completed
    work: 승인된 결과를 GitHub main과 Production에 반영
    exit_condition: 실제 배포 상태 확인
    user_intervention: explicit_approval
  - id: restore
    label: 이전 Version 복구
    status: completed
    work: 실패 시 직전 정상 Version으로 되돌아갈 수 있음을 확인
    exit_condition: Production 배포와 복구가 모두 성공
    user_intervention: only_if_recovery_changes_production
required_checks:
  design:
    - same_viewport_target_runtime_comparison
    - layout_spacing_color_typography_classification
    - desktop_mobile_accessibility
  function:
    - primary_user_task
    - interaction_and_error_states
    - restart_and_restore
