schema_version: "1.0"
state_revision: 14
recorded_at_commit: "e98f73190f7219e279ff44117eac09e9ba0a7d09"

system:
  id: ai-os-v2
  name: AI OS V2
  target: enterprise_control_plane
  canonical_repository: songja-092/ai-os-v2
  canonical_branch: main

program:
  active_program: post_mvp_system
  active_stage: ready_for_project
  status: maintenance_complete_optional_editor_security_deferred

locks:
  core_mvp:
    range: M1-M7
    status: completed_locked
    modification_requires: explicit_user_approval

products:
  electronic_business_card:
    status: verified_limited
    evidence_scope: single_product_runtime
    production: not_proven
  story_board:
    status: paused_at_m1_foundation
    evidence_scope: fixture_specific
    runtime: not_started
    production: not_proven

harness_policy:
  mode: lightweight_stage_control
  evidence_documents_required: false
  follow_planned_order: true
  small_reorder: automatic
  major_stage_change: user_approval
  active_bottlenecks: 1
  completion_requires:
    - production_deploy
    - previous_version_restore

quality_policy:
  role_or_registration_is_sufficient: false
  evidence_documents_required: false
  sufficient_verdict_requires:
    - objective_runtime_checks_pass
    - expected_and_actual_result_compared
    - failure_and_recovery_paths_pass
  design_checks:
    - same_viewport_target_runtime_comparison
    - layout_spacing_color_typography_classified
    - mobile_desktop_and_accessibility_pass
  function_checks:
    - primary_user_task_completed
    - interaction_states_and_error_paths_pass
    - restart_and_previous_version_restore_pass
  user_experience:
    final_human_judgment_required: true
    objective_checks_cannot_be_replaced_by_role_presence: true

capability_workstreams:
  core:
    planned_stages: [idea, planning, static, dynamic_runtime, staging, production, restore]
    current_stage: dynamic_runtime
    status: completed
    next_stage: staging
    blocker: none
  design:
    planned_stages: [idea, planning, mockup, static, dynamic_runtime, staging, production, restore]
    current_stage: restore
    status: completed
    next_stage: restore
    blocker: none
  collector:
    planned_stages: [idea, planning, static, dynamic_runtime, staging, production, restore]
    current_stage: dynamic_runtime
    status: completed
    next_stage: staging
    blocker: none
  product_harness:
    planned_stages: [idea, planning, static, dynamic_runtime, staging, production, restore]
    current_stage: dynamic_runtime
    status: completed
    next_stage: staging
    blocker: none
  editor:
    planned_stages: [idea, planning, mockup, static, dynamic_runtime, staging, production, restore]
    current_stage: dynamic_runtime
    status: verified_limited
    next_stage: staging
    blocker: transitive_tiptap_moderate_vulnerability
  deployment_operations:
    planned_stages: [idea, planning, staging, production, restore]
    current_stage: restore
    status: completed
    next_stage: restore
    blocker: none

focus:
  strategy: single_highest_bottleneck
  active_workstream: editor
  active_bottleneck: optional_editor_dependency_security_deferred
  priority_order:
    - shared_core_blocker
    - paused_failure
    - repeated_cross_workstream_problem
    - production_restore_blocker
    - convenience_and_new_ideas

governance:
  change_log: state/control-plane-events.jsonl
  roles:
    owner:
      can: [plan, approve, deploy, restore]
    executor:
      can: [inspect, implement, verify, small_reorder]
    verifier:
      can: [inspect, verify]
  approvals:
    required_for: [major_stage_change, git_commit, git_push, production_deploy, delete, cost, external_transfer]
    automatic_for: [implementation, relevant_checks, ordinary_repairs, diagram_refresh, small_reorder]
  failure_isolation: workstream
  state_owner: control_plane

environments:
  local:
    status: active
    purpose: development
  staging:
    status: verified_local_rehearsal
    isolated: true
  production:
    status: deployed_to_github_main
    restore_required: true
    restore_status: passed_in_isolated_worktree

gates:
  session_preflight: required
  state_schema: required
  dirty_conflict: block
  protected_lock_change: block
  evidence_validation: required
  final_user_approval: required
  restore_validation: required_for_completion

roadmap:
  current_phase: 4
  status: completed
  phases:
    - id: phase_1
      name: 상태 기준 통일
      status: completed
    - id: phase_2
      name: 변경 이력과 승인 체계
      status: completed
    - id: phase_3
      name: 제품·환경·권한 분리
      status: completed
    - id: phase_4
      name: 시각적 관제와 운영 자동화
      status: completed

next_action:
  id: project-intake-ready
  description: 필수 V2 정비 완료 상태에서 다음 실제 프로젝트 목표와 범위를 등록; 선택형 Editor는 보안 업데이트 전까지 격리 유지
