<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V2 예약 조사 브리핑</title><style>
:root{--bg:#f4f8f6;--surface:#fff;--text:#14231e;--muted:#68756f;--line:#cbdad4;--green:#00a86b;--soft:#e8f7f1;--warn:#a76500}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Pretendard,"Noto Sans KR",system-ui,sans-serif}.module{max-width:980px;margin:30px auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}.head{padding:22px 24px;border-bottom:1px solid var(--line)}.head h1{margin:0 0 6px;font-size:24px}.head p{margin:0;color:var(--muted)}.body{padding:22px 24px}.config{display:grid;grid-template-columns:1fr 160px;gap:14px;margin-bottom:18px}.field label{display:block;font-weight:800;margin-bottom:7px}.field input{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px;font:inherit}.sources{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.source{display:flex;gap:6px;align-items:center;background:var(--soft);padding:8px 10px;border-radius:999px;font-size:13px}.source[data-status*="required"],.source[data-status*="not_connected"]{background:#fff4dc;color:var(--warn)}.item{border:1px solid var(--line);border-radius:11px;padding:18px}.item .kind{font-size:13px;color:#00794f;font-weight:800}.item h2{font-size:19px;margin:7px 0}.item p{color:var(--muted);line-height:1.6}.item a{color:#00794f;font-weight:800}.notice{margin-top:16px;padding:14px;border:1px dashed var(--line);border-radius:9px;color:var(--muted)}.review{margin-top:20px;border-top:1px solid var(--line);padding-top:18px;display:flex;justify-content:space-between;gap:16px;align-items:center}.review b{display:block;margin-bottom:5px}.actions{display:flex;gap:8px}.actions button{border:1px solid var(--line);border-radius:8px;background:#fff;padding:10px 13px;font-weight:750}.actions .primary{background:var(--green);border-color:var(--green);color:#fff}.status{padding:8px 10px;background:var(--soft);color:#00794f;border-radius:8px;font-weight:800;font-size:13px}@media(max-width:720px){.module{margin:0;border-radius:0}.config{grid-template-columns:1fr}.review{flex-direction:column}.actions{width:100%}.actions button{flex:1}}
</style></head><body><main class="module" data-module-id="daily-discovery-briefing"><header class="head"><h1>예약 조사 브리핑</h1><p>주제·시간·조사할 플랫폼을 사용자가 정합니다.</p></header><section class="body"><div class="config"><div class="field"><label for="topic">무엇을 조사할까요?</label><input id="topic" type="text" placeholder="예: 인테리어 커뮤니티에서 인기 있는 수익 아이템"></div><div class="field"><label for="hour">언제 조사할까요?</label><input id="hour" type="time" value="09:00" aria-label="브리핑 실행 시간"></div></div><div class="field"><label>어디에서 조사할까요?</label><div class="sources" id="sources"></div></div><div id="items"></div><div class="notice">Threads·Instagram은 사용자가 로그인한 브라우저 세션이 유효할 때만 읽습니다. 접근 제한을 우회하지 않습니다.</div><div class="review"><div><b>조건을 정한 뒤 저장해주세요</b><span class="status" id="event-status">주제 입력 대기</span></div><div class="actions"><button data-action="briefing.direction.change">취소</button><button class="primary" id="save-config" type="button">조사 예약</button></div></div></section></main><script>
const fixture={allowed_actions:['briefing.config.update','briefing.direction.change'],sources:[{id:'github',name:'GitHub',status:'public_metadata_available'},{id:'reddit',name:'Reddit',status:'planned_not_connected'},{id:'youtube',name:'YouTube',status:'planned_not_connected'},{id:'threads',name:'Threads',status:'user_browser_session_required'},{id:'instagram',name:'Instagram',status:'user_browser_session_required'}],items:[{category:'표시 예시',title:'예약 조사 결과는 여기에 표시됩니다',url:'https://github.com/',short_summary:'실제 자동 수집 결과가 아니라 링크와 짧은 요약의 위치를 보여주는 Fixture입니다.',source:'Fixture'}]};const allowed=new Set(fixture.allowed_actions),status=document.querySelector('#event-status');document.querySelector('#sources').innerHTML=fixture.sources.map(x=>`<label class="source" data-status="${x.status}" title="${x.status}"><input type="checkbox" value="${x.id}">${x.name}</label>`).join('');document.querySelector('#items').innerHTML=fixture.items.map(x=>`<article class="item"><span class="kind">${x.category} · ${x.source} · Fixture</span><h2>${x.title}</h2><p>${x.short_summary}</p><a href="${x.url}" target="_blank" rel="noreferrer">원본 웹 링크 열기</a></article>`).join('');function emit(type,payload={}){if(!allowed.has(type)){status.textContent='허용되지 않은 행동';return}const detail={action_type:type,payload,source_module:'daily-discovery-briefing'};window.dispatchEvent(new CustomEvent('v2-module-action',{detail}));document.documentElement.dataset.lastAction=JSON.stringify(detail);status.textContent='예약 요청 전달됨 · Core 승인 대기'}document.querySelector('#save-config').addEventListener('click',()=>{const topic=document.querySelector('#topic').value.trim(),platforms=[...document.querySelectorAll('#sources input:checked')].map(x=>x.value);if(!topic){status.textContent='먼저 조사 주제를 입력해주세요';return}if(!platforms.length){status.textContent='조사할 플랫폼을 하나 이상 선택해주세요';return}emit('briefing.config.update',{topic,time:document.querySelector('#hour').value,timezone:'Asia/Seoul',platforms})});document.querySelectorAll('[data-action]').forEach(button=>button.addEventListener('click',()=>emit(button.dataset.action)));
</script></body></html>
