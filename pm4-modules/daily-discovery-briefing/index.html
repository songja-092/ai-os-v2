<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V2 PM4 조사 브리핑</title><style>
:root{--bg:#f4f8f6;--surface:#fff;--text:#14231e;--muted:#68756f;--line:#cbdad4;--green:#008f5d;--soft:#e8f7f1;--warn:#a76500}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Pretendard,"Noto Sans KR",system-ui,sans-serif}.module{max-width:1180px;margin:24px auto}.head,.panel,.item{background:var(--surface);border:1px solid var(--line);border-radius:14px}.head{padding:22px 24px;margin-bottom:14px}.head h1{margin:0 0 6px;font-size:25px}.head p,.item p{margin:0;color:var(--muted);line-height:1.55}.summary{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:14px}.panel{padding:18px}.panel h2{font-size:17px;margin:0 0 10px}.policy{line-height:1.65;color:var(--muted)}.sources,.facts,.links,.decisions{display:flex;gap:8px;flex-wrap:wrap}.source,.facts span{padding:7px 9px;border-radius:999px;background:var(--soft);font-size:12px;font-weight:750}.source[data-ready="false"]{background:#fff4dc;color:var(--warn)}.list{display:grid;gap:12px}.item{padding:18px;display:grid;grid-template-columns:1fr auto;gap:14px}.meta{font-size:13px;color:#00794f;font-weight:800}.item h3{font-size:19px;margin:7px 0}.item p{margin-bottom:10px;max-width:820px}.links{margin-top:12px}.links a{color:#00794f;font-weight:800}.decisions{align-items:flex-start}.decisions button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 11px;font-weight:800;cursor:pointer}.decisions button.active{background:var(--green);border-color:var(--green);color:#fff}.empty{padding:30px;text-align:center;color:var(--muted)}#status{position:sticky;bottom:14px;margin:14px auto 0;max-width:max-content;background:#14231e;color:#fff;padding:10px 14px;border-radius:999px;font-size:13px}@media(max-width:760px){.module{margin:0}.head,.panel{border-radius:0}.summary,.item{grid-template-columns:1fr}}
</style></head><body><main class="module"><header class="head"><h1>최근 30일 AI·바이브코딩 조사</h1><p>추천 알고리즘은 관련 채널을 찾는 데만 쓰고, 최종 판단은 공개 근거와 사용자 선택으로 결정합니다.</p></header><section class="summary"><article class="panel"><h2>조사 기준</h2><div class="policy" id="policy">Core 상태를 불러오는 중입니다.</div></article><article class="panel"><h2>플랫폼 연결 상태</h2><div class="sources" id="sources"></div></article></section><section class="list" id="items"><div class="panel empty">조사 결과를 불러오는 중입니다.</div></section><div id="status">Core 연결 중</div></main><script>
const requestId='pm4-ai-vibe-coding-social-2026-08-21';let state=null;const labels={github:'GitHub',instagram:'Instagram',youtube:'YouTube',reddit:'Reddit',threads:'Threads'};const decisions={adopt:'채택',hold:'보류',discard:'폐기'};const status=document.querySelector('#status');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function metricText(item){const p=item.popularity||{};if(item.platform==='github')return `별 ${Number(p.stars||0).toLocaleString()} · Fork ${Number(p.forks||0).toLocaleString()}`;return p.score==null?'인기 수치 부족 · 순위 없음':`해당 플랫폼 내 상대 점수 ${p.score}`}
function render(next){state=next;document.querySelector('#policy').innerHTML=`<b>${esc(state.topic)}</b><br>기간: 최근 ${state.period_days}일 · 채널 우선 · 중복 제거 · 없는 인기 수치는 추측하지 않음<br>플랫폼 추천 알고리즘은 <b>발견 보조</b>로만 사용하며, 채택·보류·폐기는 사용자가 결정합니다.`;document.querySelector('#sources').innerHTML=state.sources.map(s=>`<span class="source" data-ready="${s.items>0}">${labels[s.id]||s.id} ${s.items}개 · ${esc(s.status)}</span>`).join('');document.querySelector('#items').innerHTML=state.items.length?state.items.map((item,index)=>`<article class="item" data-item-id="${esc(item.item_id)}"><div><div class="meta">${index+1}. ${labels[item.platform]||item.platform} · ${esc(item.channel||'채널 미확인')} · ${esc((item.observed_at||'').slice(0,10))}</div><h3>${esc(item.title)}</h3><p>${esc(item.short_summary)}</p><div class="facts"><span>${esc(metricText(item))}</span><span>${item.project_ready?'프로젝트 시도 자료 있음':'원문 확인 필요'}</span><span>${esc(item.cost||'비용 확인 필요')}</span><span>${esc(item.license||'라이선스 확인 필요')}</span></div><div class="links"><a href="${esc(item.url)}" target="_blank" rel="noreferrer">원본 열기</a>${item.channel_url?`<a href="${esc(item.channel_url)}" target="_blank" rel="noreferrer">채널 열기</a>`:''}</div></div><div class="decisions">${Object.entries(decisions).map(([key,label])=>`<button data-decision="${key}" class="${state.decisions[item.item_id]===key?'active':''}">${label}</button>`).join('')}</div></article>`).join(''):'<div class="panel empty">최근 30일 조건을 통과한 검증 자료가 없습니다.</div>';status.textContent=`Core 연결됨 · ${state.items.length}개 표시 · 판정 ${Object.keys(state.decisions).length}개 저장`;bind()}
function bind(){document.querySelectorAll('[data-decision]').forEach(button=>button.addEventListener('click',async()=>{try{const itemId=button.closest('[data-item-id]').dataset.itemId,choice=button.dataset.decision,current=state.decisions[itemId],payload={request_id:requestId,action:current===choice?'research.decision.clear':'research.decision.set',item_id:itemId,decision:choice};status.textContent='판정을 Core에 저장하는 중';const response=await fetch('/api/pm4/ui-action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),body=await response.json();if(!response.ok)throw new Error(body.error||'저장 실패');render(body.state)}catch(error){status.textContent=`오류: ${error.message}`}}))}
fetch(`/api/pm4/ui-state?request_id=${encodeURIComponent(requestId)}`).then(async response=>{const body=await response.json();if(!response.ok)throw new Error(body.error||'Core 연결 실패');render(body)}).catch(error=>{status.textContent=`오류: ${error.message}`;document.querySelector('#items').innerHTML='<div class="panel empty">PM4 Core 상태를 불러오지 못했습니다.</div>'});
</script></body></html>
