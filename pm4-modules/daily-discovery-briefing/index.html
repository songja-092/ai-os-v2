<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>V2 일일 뉴스·탐색 브리핑</title>
  <style>
    :root{--bg:#f4f8f6;--surface:#fff;--text:#14231e;--muted:#68756f;--line:#cbdad4;--green:#00a86b;--soft:#e8f7f1;--warn:#a76500}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Pretendard,"Noto Sans KR",system-ui,sans-serif}.module{max-width:980px;margin:30px auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}.head{padding:22px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;align-items:start}.head h1{margin:0 0 6px;font-size:24px}.head p{margin:0;color:var(--muted)}.schedule{display:flex;align-items:center;gap:8px}.schedule input{width:76px;border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit}.schedule button,.actions button{border:1px solid var(--line);border-radius:8px;background:#fff;padding:10px 13px;font-weight:750}.schedule button,.actions .primary{background:var(--green);border-color:var(--green);color:#fff}.body{padding:22px 24px}.sources{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.source{background:var(--soft);padding:8px 10px;border-radius:999px;font-size:13px}.source[data-status*="required"],.source[data-status*="not_connected"]{background:#fff4dc;color:var(--warn)}.item{border:1px solid var(--line);border-radius:11px;padding:18px}.item .kind{font-size:13px;color:#00794f;font-weight:800}.item h2{font-size:19px;margin:7px 0}.item p{color:var(--muted);line-height:1.6}.item a{color:#00794f;font-weight:800}.notice{margin-top:16px;padding:14px;border:1px dashed var(--line);border-radius:9px;color:var(--muted)}.review{margin-top:20px;border-top:1px solid var(--line);padding-top:18px;display:flex;justify-content:space-between;gap:16px;align-items:center}.review b{display:block;margin-bottom:5px}.actions{display:flex;gap:8px}.status{padding:8px 10px;background:var(--soft);color:#00794f;border-radius:8px;font-weight:800;font-size:13px}@media(max-width:720px){.module{margin:0;border-radius:0}.head,.review{flex-direction:column}.schedule,.actions{width:100%}.schedule input{flex:1}.actions button{flex:1}}
  </style>
</head>
<body><main class="module" data-module-id="daily-discovery-briefing">
  <header class="head"><div><h1>일일 뉴스·탐색 브리핑</h1><p>참고자료·V2 적용 후보·수익 아이템을 링크와 짧은 요약으로 확인합니다.</p></div><div class="schedule"><label for="hour">매일</label><input id="hour" type="time" value="07:00" aria-label="브리핑 실행 시간"><button id="save-time" type="button">시간 변경</button></div></header>
  <section class="body"><div class="sources" id="sources"></div><div id="items"></div><div class="notice">Threads·Instagram은 사용자가 로그인한 브라우저 세션이 유효할 때만 읽습니다. 접근 제한을 우회하지 않습니다.</div><div class="review"><div><b>이 정도면 충분한가요?</b><span class="status" id="event-status">사용자 결정 대기</span></div><div class="actions"><button data-action="briefing.direction.change">방향 수정</button><button data-action="briefing.accept.current">이 정도면 충분</button><button class="primary" data-action="briefing.collect.more">자료 더 찾기</button></div></div></section>
</main><script>
const fixture={schedule:{hour:7,minute:0},allowed_actions:['briefing.schedule.update','briefing.collect.more','briefing.direction.change','briefing.accept.current'],sources:[{name:'GitHub',status:'public_metadata_available'},{name:'Reddit',status:'planned_not_connected'},{name:'YouTube',status:'planned_not_connected'},{name:'Threads',status:'user_browser_session_required'},{name:'Instagram',status:'user_browser_session_required'}],items:[{category:'V2 적용 후보',title:'PM4 브리핑 표시 예시',url:'https://github.com/',short_summary:'실제 자동 수집 결과가 아니라 원본 링크와 짧은 요약 표시를 검증하기 위한 Fixture입니다.',source:'GitHub',fixture_only:true}]};
const allowed=new Set(fixture.allowed_actions);const status=document.querySelector('#event-status');
document.querySelector('#sources').innerHTML=fixture.sources.map(x=>`<span class="source" data-status="${x.status}" title="${x.status}">${x.name}</span>`).join('');
document.querySelector('#items').innerHTML=fixture.items.map(x=>`<article class="item"><span class="kind">${x.category} · ${x.source}${x.fixture_only?' · Fixture':''}</span><h2>${x.title}</h2><p>${x.short_summary}</p><a href="${x.url}" target="_blank" rel="noreferrer">원본 웹 링크 열기</a></article>`).join('');
function emit(type,payload={}){if(!allowed.has(type)){status.textContent='허용되지 않은 행동';return}const detail={action_type:type,payload,source_module:'daily-discovery-briefing'};window.dispatchEvent(new CustomEvent('v2-module-action',{detail}));document.documentElement.dataset.lastAction=JSON.stringify(detail);status.textContent='요청 전달됨 · Core 승인 대기'}
document.querySelector('#save-time').addEventListener('click',()=>emit('briefing.schedule.update',{time:document.querySelector('#hour').value,timezone:'Asia/Seoul'}));
document.querySelectorAll('[data-action]').forEach(button=>button.addEventListener('click',()=>emit(button.dataset.action)));
</script></body></html>
