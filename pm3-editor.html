<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI OS V2 · PM3 마우스 편집</title>
  <style>
    :root{--ink:#14251f;--muted:#60746b;--line:#bfd2ca;--accent:#00a86b;--soft:#e4f6ef;--danger:#c53e57;--panel:#fff}
    *{box-sizing:border-box}body{margin:0;background:#f8fbfa;color:var(--ink);font-family:Arial,"Noto Sans KR",sans-serif}
    button,input{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:225px 1fr}.side{border-right:1px solid var(--line);padding:28px 16px;background:#f3faf7}.brand{display:block;color:var(--ink);font-size:22px;font-weight:800;padding:0 14px 28px;border-bottom:1px solid var(--line);text-decoration:none}.nav{display:grid;gap:8px;margin-top:20px}.nav a{padding:13px 14px;border-radius:8px;color:var(--ink);text-decoration:none}.nav a.active{background:#d8f2e8;color:#007d50;font-weight:800}.main{padding:26px;min-width:0}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:16px}.top h1{margin:0;font-size:24px}.state{font-size:12px;font-weight:800;color:#007d50}.actions{display:flex;gap:8px;flex-wrap:wrap}.button{min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:#fff;font-weight:800;cursor:pointer}.button.primary{background:var(--accent);border-color:var(--accent);color:#fff}.button.danger{color:var(--danger)}.button:disabled{opacity:.42;cursor:not-allowed}.help{margin:18px 0;padding:13px 15px;border:1px solid #b7d8ca;border-radius:9px;background:#edf8f3;color:#365c4e;line-height:1.55}.workbench{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px}.canvas{display:grid;gap:14px;align-content:start}.section{border:1px solid var(--line);border-radius:11px;background:var(--panel);overflow:hidden}.section.dragging{opacity:.45}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line);background:#fbfdfc;cursor:grab}.section-head h2{font-size:16px;margin:0}.drag-label{font-size:12px;color:var(--muted)}.section-body{padding:14px}.cards{display:grid;gap:10px}.card{position:relative;border:2px solid color-mix(in srgb,var(--card-color) 65%,#fff);border-left:7px solid var(--card-color);border-radius:10px;background:#fff;padding:14px;cursor:grab;min-width:0;transition:box-shadow .15s,transform .15s}.card:hover{box-shadow:0 7px 20px #183b2c16}.card.selected{outline:3px solid color-mix(in srgb,var(--card-color) 28%,transparent);outline-offset:2px}.card.dragging{opacity:.45}.card[data-size="small"]{width:55%;min-height:76px}.card[data-size="medium"]{width:78%;min-height:100px}.card[data-size="large"]{width:100%;min-height:134px}.card h3{margin:0 0 6px;font-size:var(--card-font)}.card p{margin:0;color:var(--muted);font-size:12px}.card[data-font="small"]{--card-font:14px}.card[data-font="medium"]{--card-font:18px}.card[data-font="large"]{--card-font:23px}.resize-handle{position:absolute;right:5px;bottom:5px;width:19px;height:19px;border-right:3px solid var(--card-color);border-bottom:3px solid var(--card-color);cursor:nwse-resize}.preview-shell{min-height:310px;display:grid;place-items:center;border:1px dashed #94b5a7;border-radius:9px;background:#f3f8f6;padding:18px;text-align:center}.preview-shell strong{font-size:20px}.properties{position:sticky;top:18px;align-self:start;border:1px solid var(--line);border-radius:11px;background:#fff;overflow:hidden}.properties h2{font-size:16px;margin:0;padding:15px;border-bottom:1px solid var(--line)}.property-body{display:grid;gap:18px;padding:15px}.property-group{display:grid;gap:9px}.property-group>strong{font-size:13px}.segmented{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.segmented button{min-height:37px;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer}.segmented button.active{border-color:var(--accent);background:var(--soft);color:#007d50;font-weight:800}.color-row{display:flex;align-items:center;gap:10px}.color-row input{width:54px;height:40px;border:0;background:none}.color-row code{font-size:12px}.change-list{margin:0;padding-left:18px;color:var(--muted);font-size:12px;line-height:1.6}.empty{font-size:12px;color:var(--muted)}.toast{position:fixed;right:24px;bottom:24px;max-width:390px;padding:13px 16px;border-radius:9px;background:#173c2e;color:#fff;box-shadow:0 10px 28px #102a2050;display:none}.toast.show{display:block}.toast.error{background:#8e2d3d}
    /* PM3 size motion: clear visual difference without making the layout feel abrupt. */
    .card{transform-origin:left center;transition:width .28s cubic-bezier(.2,.8,.2,1),min-height .28s cubic-bezier(.2,.8,.2,1),padding .28s cubic-bezier(.2,.8,.2,1),box-shadow .18s ease,transform .18s ease,border-color .22s ease}
    .card.dragging{transform:scale(.985)}
    .card[data-size="xsmall"]{width:28%;min-height:58px;padding:9px 11px}
    .card[data-size="small"]{width:46%;min-height:68px;padding:11px 12px}
    .card[data-size="medium"]{width:66%;min-height:96px;padding:14px}
    .card[data-size="large"]{width:83%;min-height:116px;padding:16px}
    .card[data-size="xlarge"]{width:100%;min-height:140px;padding:18px}
    .card h3{transition:font-size .24s cubic-bezier(.2,.8,.2,1)}
    .resize-handle{transition:border-color .22s ease}
    .segmented button{transition:background .18s ease,border-color .18s ease,color .18s ease}
    @media(prefers-reduced-motion:reduce){.card,.card h3,.resize-handle,.segmented button{transition:none}}
    .range-control{display:grid;gap:7px}.range-control input{width:100%;accent-color:var(--accent);cursor:pointer}.range-value{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted)}.range-value strong{color:#007d50}.range-ticks{display:flex;justify-content:space-between;font-size:10px;color:#809188}
    @media(max-width:1050px){.app{grid-template-columns:1fr}.side{display:none}.main{padding:16px}.workbench{grid-template-columns:1fr}.properties{position:static}.card[data-size="xsmall"]{width:36%}.card[data-size="small"]{width:52%}}
  </style>
</head>
<body><div class="app">
  <aside class="side"><a class="brand" href="./pm2-workspace.html">AI OS V2</a><nav class="nav"><a href="./pm2-workspace.html">대시보드</a><a href="./pm2-module-test.html">PM2 잠금본</a><a class="active" href="./pm3-editor.html">PM3 부분 수정</a></nav></aside>
  <main class="main">
    <header class="top"><div><h1>PM3 · 마우스로 화면 수정</h1><span class="state" id="stateLabel">Draft 불러오는 중</span></div><div class="actions"><button class="button" id="undo">되돌리기</button><button class="button" id="redo">다시 실행</button><button class="button danger" id="discard">수정 취소</button><button class="button primary" id="apply">이 배치 적용</button></div></header>
    <div class="help"><strong>사용법:</strong> 패널 제목을 끌면 레이아웃 순서가 바뀌고, 카드를 끌면 카드 순서가 바뀍니다. 카드를 클릭하면 오른쪽에서 색상·글씨·크기를 바꿀 수 있습니다. 모서리를 끌어도 크기가 바뀌니다.</div>
    <div class="workbench"><div class="canvas" id="canvas"></div><aside class="properties"><h2>선택한 카드 수정</h2><div class="property-body"><div id="selectedName" class="empty">카드를 선택해주세요.</div><div class="property-group"><strong>대표 색상</strong><div class="color-row"><input id="color" type="color" aria-label="카드 대표 색상"><code id="colorValue">-</code></div></div><div class="property-group"><strong>글씨 크기</strong><div class="range-control"><input id="fontRange" type="range" min="1" max="5" step="1" aria-label="글씨 크기 5단계"><div class="range-value"><span>1 매우 작게</span><strong id="fontValue">보통</strong><span>5 매우 크게</span></div><div class="range-ticks"><span>●</span><span>●</span><span>●</span><span>●</span><span>●</span></div></div></div><div class="property-group"><strong>카드 크기</strong><div class="range-control"><input id="sizeRange" type="range" min="1" max="5" step="1" aria-label="카드 크기 5단계"><div class="range-value"><span>1 매우 작게</span><strong id="sizeValue">보통</strong><span>5 매우 크게</span></div><div class="range-ticks"><span>●</span><span>●</span><span>●</span><span>●</span><span>●</span></div></div></div><div class="property-group"><strong>이번 Draft 변경</strong><ul class="change-list" id="changes"></ul></div><button class="button" id="restore">초기 배치로 복원</button></div></aside></div>
  </main><div class="toast" id="toast"></div>
</div>
<script>
const projectId='pdf-drawing-symbols',canvas=document.getElementById('canvas'),toast=document.getElementById('toast');let state=null,resizeStart=null,pointerDrag=null,suppressClick=false;
const levels=['xsmall','small','medium','large','xlarge'],labels={xsmall:'매우 작게',small:'작게',medium:'보통',large:'크게',xlarge:'매우 크게'};const cardNames={'pdf-result-preview':'PDF 도면 기호','hospital-web-result-preview':'동네 병원 웹'};
function notify(message,error=false){toast.textContent=message;toast.className=`toast show${error?' error':''}`;setTimeout(()=>toast.className='toast',2400)}
function cardMarkup(id){const card=state.draft.cards[id];return `<article class="card ${state.selected_card_id===id?'selected':''}" data-card="${id}" data-size="${card.size}" data-font="${card.font_size}" style="--card-color:${card.color}"><h3>${cardNames[id]}</h3><p>${id==='pdf-result-preview'?'도면의 문·창문·벽·기호를 확인하는 결과물':'의료진·예약·병원 정보를 제공하는 웹 결과물'}</p><span class="resize-handle" title="끌어서 크기 변경"></span></article>`}
function sectionMarkup(id){if(id==='project-list')return `<section class="section" data-section="project-list"><div class="section-head" data-section-handle="project-list"><h2>프로젝트 결과 카드</h2><span class="drag-label">☷ 여기를 끌어서 패널 이동</span></div><div class="section-body"><div class="cards" id="cards">${state.draft.card_order.map(cardMarkup).join('')}</div></div></section>`;return `<section class="section" data-section="preview"><div class="section-head" data-section-handle="preview"><h2>선택한 결과 Preview</h2><span class="drag-label">☷ 여기를 끌어서 패널 이동</span></div><div class="section-body"><div class="preview-shell"><div><strong>${cardNames[state.selected_card_id]}</strong><p>선택한 결과물은 하나만 표시됩니다.</p></div></div></div></section>`}
function render(){canvas.innerHTML=state.draft.layout_order.map(sectionMarkup).join('');document.getElementById('stateLabel').textContent=`Design Version ${state.design_version} · ${state.dirty?'수정 중':'적용본과 같음'}`;document.getElementById('undo').disabled=!state.past.length;document.getElementById('redo').disabled=!state.future.length;document.getElementById('discard').disabled=!state.dirty;document.getElementById('apply').disabled=!state.dirty;renderProperties();bindDrag()}
function renderProperties(){const id=state.selected_card_id,card=state.draft.cards[id];document.getElementById('selectedName').innerHTML=`<strong>${cardNames[id]}</strong><br><span class="empty">${id}</span>`;const color=document.getElementById('color');color.value=card.color;document.getElementById('colorValue').textContent=card.color;const fontRange=document.getElementById('fontRange'),sizeRange=document.getElementById('sizeRange');fontRange.value=levels.indexOf(card.font_size)+1;sizeRange.value=levels.indexOf(card.size)+1;document.getElementById('fontValue').textContent=labels[card.font_size];document.getElementById('sizeValue').textContent=labels[card.size];document.getElementById('changes').innerHTML=state.past.length?state.past.map((entry,index)=>`<li>${index+1}. ${entry.label}</li>`).join(''):'<li>아직 변경이 없습니다.</li>';fontRange.oninput=()=>document.getElementById('fontValue').textContent=labels[levels[Number(fontRange.value)-1]];fontRange.onchange=()=>act('style.set_font_size',{value:levels[Number(fontRange.value)-1]});sizeRange.oninput=()=>document.getElementById('sizeValue').textContent=labels[levels[Number(sizeRange.value)-1]];sizeRange.onchange=()=>act('card.set_size',{value:levels[Number(sizeRange.value)-1]});color.onchange=()=>act('style.set_color',{value:color.value})}
function startPointerDrag(event,type,id,element){if(event.button!==0)return;pointerDrag={type,id,startX:event.clientX,startY:event.clientY,active:false,element};element.setPointerCapture(event.pointerId)}
function movePointerDrag(event){if(!pointerDrag)return;const distance=Math.hypot(event.clientX-pointerDrag.startX,event.clientY-pointerDrag.startY);if(distance>7&&!pointerDrag.active){pointerDrag.active=true;pointerDrag.element.classList.add('dragging')}if(pointerDrag.active)event.preventDefault()}
function finishPointerDrag(event){if(!pointerDrag)return;const current=pointerDrag;pointerDrag=null;current.element.classList.remove('dragging');if(!current.active)return;event.preventDefault();suppressClick=true;setTimeout(()=>suppressClick=false,0);const target=document.elementFromPoint(event.clientX,event.clientY);if(current.type==='section'){const targetSection=target&&target.closest('[data-section]');if(targetSection&&targetSection.dataset.section!==current.id)act('layout.move',{source_id:current.id,target_id:targetSection.dataset.section})}else{const targetCard=target&&target.closest('[data-card]');if(targetCard&&targetCard.dataset.card!==current.id)act('card.move',{source_id:current.id,target_id:targetCard.dataset.card})}}
function bindDrag(){document.querySelectorAll('[data-section]').forEach(section=>{const handle=section.querySelector('[data-section-handle]');handle.addEventListener('pointerdown',event=>startPointerDrag(event,'section',handle.dataset.sectionHandle,section));handle.addEventListener('pointermove',movePointerDrag);handle.addEventListener('pointerup',finishPointerDrag);handle.addEventListener('pointercancel',finishPointerDrag)});document.querySelectorAll('[data-card]').forEach(card=>{card.addEventListener('click',event=>{if(!suppressClick&&!event.target.closest('.resize-handle'))act('section.select',{card_id:card.dataset.card})});card.addEventListener('pointerdown',event=>{if(!event.target.closest('.resize-handle'))startPointerDrag(event,'card',card.dataset.card,card)});card.addEventListener('pointermove',movePointerDrag);card.addEventListener('pointerup',finishPointerDrag);card.addEventListener('pointercancel',finishPointerDrag);const handle=card.querySelector('.resize-handle');handle.addEventListener('pointerdown',event=>{event.preventDefault();event.stopPropagation();resizeStart={id:card.dataset.card,x:event.clientX,width:card.getBoundingClientRect().width};handle.setPointerCapture(event.pointerId)});handle.addEventListener('pointerup',event=>{if(!resizeStart)return;const ratio=(resizeStart.width+event.clientX-resizeStart.x)/card.parentElement.getBoundingClientRect().width;const value=ratio<.36?'xsmall':ratio<.56?'small':ratio<.75?'medium':ratio<.92?'large':'xlarge';resizeStart=null;act('section.select',{card_id:card.dataset.card},false).then(()=>act('card.set_size',{value}))});handle.addEventListener('pointercancel',()=>{resizeStart=null})})}
async function load(){const response=await fetch(`/api/pm3/ui-state?project_id=${projectId}`,{cache:'no-store'}),body=await response.json();if(!response.ok)throw new Error(body.error);state=body;render()}
async function act(action,extra={},announce=true){const response=await fetch('/api/pm3/ui-action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project_id:projectId,action,...extra})}),body=await response.json();if(!response.ok)throw new Error(body.error);state=body.state;render();if(announce)notify(body.message);return body}
document.getElementById('undo').onclick=()=>act('draft.undo');document.getElementById('redo').onclick=()=>act('draft.redo');document.getElementById('discard').onclick=()=>act('draft.discard');document.getElementById('apply').onclick=()=>act('draft.apply');document.getElementById('restore').onclick=()=>act('version.restore');load().catch(error=>notify(error.message,true));
</script></body></html>
