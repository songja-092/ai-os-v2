<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PDF 도면 결과 Preview Module</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#eef5f2;color:#13231d;font-family:Arial,"Noto Sans KR",sans-serif}
    .stage{min-height:620px;display:grid;place-items:center;padding:28px}.phone{width:390px;height:585px;border:9px solid #142a22;border-radius:31px;background:#fff;overflow:hidden;box-shadow:0 20px 38px rgba(20,42,34,.18)}
    .head{height:49px;border-bottom:1px solid #c7d8d1;padding:0 14px;display:flex;align-items:center;justify-content:space-between;font-weight:700}.request{margin:10px 14px;padding:9px 10px;border-radius:6px;background:#e2f3ec;color:#305e4e;font-size:12px}.plan{height:345px;margin:14px;background:linear-gradient(90deg,transparent 24px,#dce5e1 25px,transparent 26px),linear-gradient(transparent 24px,#dce5e1 25px,transparent 26px),#fafcfe;background-size:50px 50px;border:1px solid #b9cdc5;position:relative}.plan:before,.plan:after{content:"";position:absolute;border:2px solid #5b907c}.plan:before{inset:45px 41px 109px 54px}.plan:after{inset:168px 118px 40px 89px}.stamp{position:absolute;width:35px;height:35px;border:2px solid #ec5680;border-radius:50%;display:grid;place-items:center;color:#d63d68;background:#fff;font-weight:700}.a{left:72px;top:83px}.b{right:57px;top:190px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px}.actions button{height:44px;border:1px solid #b9cdc5;border-radius:7px;background:#fff}.actions .pass{background:#00a86b;border-color:#00a86b;color:#fff}
  </style>
</head>
<body>
  <main class="stage" data-module-id="pdf-result-preview" data-module-version="0.1.0-pilot">
    <section class="phone" aria-label="PDF 도면 결과 Preview">
      <div class="head"><span>PDF 도면 기호</span><span>•••</span></div>
      <div class="request">요청: 도면 위 기호 배치·수정·새 PDF 저장</div>
      <div class="plan"><span class="stamp a">A</span><span class="stamp b">B</span></div>
      <div class="actions"><button>수정 필요</button><button class="pass">통과</button></div>
    </section>
  </main>
</body>
</html>
