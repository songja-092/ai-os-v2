<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI OS V2 — 디자인 자료실</title>
  <style>
    :root{--bg:#f4f7f3;--panel:#fff;--ink:#17231f;--muted:#62716b;--line:#b7c5bf;--green:#276b50;--green-soft:#e3f0e8;--amber:#8a641e;--red:#a14646}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif}.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}.nav{background:#e3ece5;border-right:1px solid #b8c8be;padding:25px 16px}.brand{font-size:20px;font-weight:900;padding:2px 10px 26px}.nav a{display:block;padding:12px;border-radius:8px;color:#42554c;text-decoration:none;font-weight:750;margin:3px 0}.nav a.active{background:#fff;color:#215f46;border:1px solid #b6c9bc}.note{margin:25px 10px 0;padding-top:17px;border-top:1px solid #bdcbc1;color:#596a62;font-size:12px;line-height:1.6}.main{padding:32px;max-width:1400px;width:100%;margin:auto}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px}.head h1{font-size:30px;margin:0 0 8px;letter-spacing:-.04em}.head p{margin:0;color:var(--muted);line-height:1.55}.safe{font-size:12px;font-weight:800;color:#246145;background:var(--green-soft);border:1px solid #a7c7b4;padding:9px 12px;border-radius:7px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.summary div{background:#fff;border:1px solid var(--line);padding:15px;border-radius:9px}.summary strong{display:block;font-size:20px}.summary span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:var(--panel);border:2px solid #b8c7c0;border-radius:11px;padding:18px;display:flex;flex-direction:column;min-height:220px}.card.decided{opacity:.67}.meta{display:flex;justify-content:space-between;gap:12px;margin-bottom:12px}.tag{font-size:11px;font-weight:800;color:#315b49;background:#edf4ef;padding:5px 7px;border-radius:5px}.fresh{font-size:11px;color:#64746d}.card h2{font-size:18px;margin:0 0 7px}.card p{font-size:13px;line-height:1.55;color:var(--muted);margin:0 0 12px}.facts{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:#4f6159;margin-top:auto;padding-top:12px;border-top:1px solid #d9e1dc}.link{color:#235fa2;text-decoration:none;font-weight:750}.actions{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:7px;margin-top:13px}.btn{height:39px;border:1px solid #aebdb6;border-radius:7px;background:#fff;color:#34483e;font-weight:800;cursor:pointer}.btn.adopt{background:var(--green);border-color:var(--green);color:#fff}.btn.hold{color:var(--amber)}.btn.discard{color:var(--red)}.btn:disabled{cursor:default;opacity:.55}.status{font-size:12px;margin-top:10px;font-weight:800;color:#315b49}.toast{position:fixed;right:24px;bottom:24px;background:#18332a;color:#fff;padding:13px 16px;border-radius:8px;display:none}.toast.show{display:block}@media(max-width:900px){.app{grid-template-columns:1fr}.nav{display:none}.grid{grid-template-columns:1fr}.summary{grid-template-columns:1fr}.main{padding:20px}}
  </style>
</head>
<body><div class="app"><aside class="nav"><div class="brand">AI OS V2</div><a href="/">대시보드</a><a class="active">디자인 자료실</a><a>프로젝트</a><a>작업 기록</a><div class="note"><strong>Design Intelligence</strong><br>공개 자료만 조사합니다.<br>채택해도 먼저 격리 시험합니다.</div></aside><main class="main">
  <header class="head"><div><h1>디자인과 도구 후보를 골라주세요</h1><p>링크로 실제 자료를 확인한 뒤 세 가지 중 하나만 선택하면 됩니다.<br>폴더·설치·검증 기록은 V2가 관리합니다.</p></div><span class="safe">내 프로젝트 비공개</span></header>
  <section class="summary"><div><strong id="all">-</strong><span>전체 후보</span></div><div><strong id="active">-</strong><span>최근 1년 활동</span></div><div><strong id="waiting">-</strong><span>선택 대기</span></div></section>
  <section class="grid" id="grid"></section>
</main></div><div class="toast" id="toast"></div>
<script>
const labels={verified_component_and_block_registry:'검증된 구현 부품',animated_shadcn_component_reference:'애니메이션 UI 자료',design_finish_second_opinion:'디자인 마감 검사',design_variance_and_anti_slop_candidate:'디자인 다양성 규칙',stitch_design_workflow_candidate:'외부 디자인 Workflow',react_motion_engine:'React 애니메이션',low_configuration_reorder_animation:'카드 이동 애니메이션',component_state_catalog_and_test_workshop:'Component 전시장·검사'};
const decisionLabels={adopt:'채택 후보 · 격리 시험',hold:'보류됨',discard:'폐기됨'};let data;const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=document.querySelector('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800)}
function render(){const items=data.candidates;document.querySelector('#all').textContent=items.length;document.querySelector('#active').textContent=items.filter(x=>x.freshness==='active_within_1y').length;document.querySelector('#waiting').textContent=items.filter(x=>!x.decision).length;document.querySelector('#grid').innerHTML=items.map(x=>`<article class="card ${x.decision?'decided':''}" data-id="${esc(x.id)}"><div class="meta"><span class="tag">${esc(labels[x.role]||x.role)}</span><span class="fresh">${x.freshness==='active_within_1y'?'최근 활동 확인':'활동 확인 필요'}</span></div><h2>${esc(x.id)}</h2><p>${esc(x.reason)}</p><div class="facts"><span>★ ${Number(x.stars||0).toLocaleString()}</span><span>${esc(x.license)}</span><a class="link" href="${esc(x.url)}" target="_blank" rel="noreferrer">실제 자료 보기 ↗</a></div><div class="actions"><button class="btn adopt" data-decision="adopt">채택</button><button class="btn hold" data-decision="hold">보류</button><button class="btn discard" data-decision="discard">폐기</button></div>${x.decision?`<div class="status">현재: ${decisionLabels[x.decision]}</div>`:''}</article>`).join('')}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-decision]');if(!b)return;const card=b.closest('[data-id]');const decision=b.dataset.decision;card.querySelectorAll('button').forEach(x=>x.disabled=true);const res=await fetch('/api/design-intelligence/decision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({candidate_id:card.dataset.id,decision})});const out=await res.json();if(!res.ok){toast(out.error||'선택을 저장하지 못했습니다.');card.querySelectorAll('button').forEach(x=>x.disabled=false);return}const item=data.candidates.find(x=>x.id===card.dataset.id);item.decision=decision;item.status=out.artifact.status;render();toast(decision==='adopt'?'격리 시험 후보로 저장했습니다.':decision==='hold'?'보류했습니다.':'후보에서 폐기했습니다.')});
fetch('/api/design-intelligence').then(r=>r.json()).then(x=>{data=x;render()}).catch(()=>toast('후보를 불러오지 못했습니다.'));
</script></body></html>
