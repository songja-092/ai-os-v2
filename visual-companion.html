<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI OS V2 — 실제 작업실 선택</title>
  <style>
    :root{--bg:#edf3f8;--panel:#fff;--ink:#142238;--muted:#66788e;--line:#b7c8d9;--blue:#1768c5;--teal:#087f82;--soft:#e8f0f7;--danger:#b53d59}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Pretendard,"Noto Sans KR",system-ui,sans-serif}.app{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100vh}.nav{background:#dce9f3;border-right:1px solid #b4c8d9;padding:24px 15px}.brand{font-size:20px;font-weight:850;padding:2px 10px 25px}.nav a{display:block;padding:12px;border-radius:8px;color:#40556d;text-decoration:none;font-weight:700;margin:3px 0}.nav a.active{background:#fff;color:#145da9;border:1px solid #bfd0df}.nav-note{margin:26px 10px 0;padding-top:16px;border-top:1px solid #b8c9d7;font-size:12px;line-height:1.55;color:#53687f}.main{padding:24px 28px 50px;max-width:1540px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:18px}.top h1{font-size:27px;margin:0 0 7px}.top p{margin:0;color:var(--muted)}.state{border:1px solid #86c6c4;background:#e5f5f3;color:#087476;padding:9px 12px;border-radius:8px;font-size:12px;font-weight:800}.guide{display:flex;gap:8px;align-items:center;margin-bottom:17px;color:#51667d;font-size:13px}.step{background:#fff;border:1px solid var(--line);padding:8px 11px;border-radius:7px}.step.active{background:#16304d;color:#fff;border-color:#16304d}.arrow{color:#91a3b6}.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:16px}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-content:start}.ref{background:#fff;border:2px solid #afc1d2;border-radius:10px;overflow:hidden;cursor:pointer;box-shadow:0 8px 24px #294b6a10}.ref:hover{border-color:#5d94c9}.ref.selected{border-color:var(--blue);box-shadow:0 0 0 3px #1768c51c}.image{height:260px;background:#d8e2ea;position:relative;overflow:hidden}.image img{width:100%;height:100%;object-fit:cover;object-position:top}.baseline{position:absolute;top:10px;left:10px;background:#fff;color:#174f88;border:1px solid #9fbcd6;padding:5px 8px;border-radius:5px;font-size:11px;font-weight:800}.info{padding:13px 14px}.info h2{font-size:15px;margin:0 0 5px}.info p{font-size:12px;line-height:1.5;color:var(--muted);margin:0 0 10px}.meta{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:#60738a}.inspector{background:#fff;border:2px solid #a9bdcf;border-radius:10px;position:sticky;top:18px;max-height:calc(100vh - 36px);overflow:auto}.inspector-head{padding:16px;border-bottom:1px solid #d6e0e8}.inspector-head h2{font-size:16px;margin:0 0 5px}.inspector-head p{font-size:12px;color:var(--muted);margin:0;line-height:1.45}.preview{margin:14px;border:1px solid #aebfd0;background:#e7eef4;position:relative;aspect-ratio:16/10;overflow:hidden}.preview img{width:100%;height:100%;object-fit:cover;object-position:top}.region{position:absolute;border:2px solid transparent;background:transparent;cursor:pointer}.region:hover{border-color:#20a5a5;background:#20a5a520}.region.selected{border-color:#087f82;background:#087f8230}.region-label{position:absolute;background:#087f82;color:#fff;padding:3px 6px;font-size:10px;left:3px;top:3px;display:none}.region:hover .region-label,.region.selected .region-label{display:block}.section{padding:0 15px 15px}.section h3{font-size:12px;margin:0 0 9px}.properties{display:grid;grid-template-columns:1fr 1fr;gap:7px}.prop{border:1px solid #bac9d7;border-radius:6px;padding:8px;font-size:12px;display:flex;gap:7px;align-items:center}.prop input{accent-color:var(--teal)}.lock{font-size:11px;color:#7a4a55;background:#fff1f3;border:1px solid #efc1cb;border-radius:6px;padding:9px;line-height:1.5;margin-top:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px;border-top:1px solid #d5e0e9}.btn{height:40px;border:1px solid #aebfd0;background:#fff;border-radius:7px;font-weight:800;color:#344b63;cursor:pointer}.btn.primary{grid-column:1/-1;background:var(--blue);color:#fff;border-color:var(--blue)}.btn:disabled{opacity:.45;cursor:not-allowed}.toast{position:fixed;right:22px;bottom:22px;background:#112942;color:#fff;padding:13px 16px;border-radius:8px;display:none}.toast.show{display:block}@media(max-width:1100px){.layout{grid-template-columns:1fr}.inspector{position:relative;top:0;max-height:none}.gallery{grid-template-columns:1fr}.app{grid-template-columns:1fr}.nav{display:none}}
  </style>
</head>
<body><div class="app"><aside class="nav"><div class="brand">AI OS V2</div><a href="/">대시보드</a><a class="active">디자인 선택</a><a>프로젝트</a><a>자료 조사</a><div class="nav-note"><strong>수정 PM1</strong><br>실제 화면만 비교합니다.<br>저장해도 제품은 바뀌지 않습니다.</div></aside><main class="main">
<header class="top"><div><h1>실제 작업실 화면에서 원하는 부분을 고르세요</h1><p>같은 종류의 화면 5개만 보여드립니다. 스타일 이름을 몰라도 됩니다.</p></div><div class="state">제품 미적용 · Draft 선택</div></header>
<div class="guide"><span class="step active">1 화면 선택</span><span class="arrow">→</span><span class="step">2 구역 선택</span><span class="arrow">→</span><span class="step">3 가져올 것 선택</span><span class="arrow">→</span><span class="step">4 결과 하나 확인</span></div>
<div class="layout"><section class="gallery" id="gallery" aria-label="실제 작업실 사례"></section><aside class="inspector"><div class="inspector-head"><h2 id="pickTitle">먼저 화면 하나를 선택하세요</h2><p id="pickHelp">선택한 화면을 크게 보고 원하는 구역을 누를 수 있습니다.</p></div><div class="preview" id="preview"></div><div class="section"><h3>가져올 속성</h3><div class="properties" id="properties"></div><div class="lock">기본 잠금: 원본 문구, Logo, 브랜드 자산, 데이터는 가져오지 않습니다.</div></div><div class="actions"><button class="btn" id="whole" disabled>전체 구조</button><button class="btn" id="clear" disabled>선택 지우기</button><button class="btn primary" id="save" disabled>구조 Draft로 저장</button></div></aside></div>
</main></div><div class="toast" id="toast"></div>
<script>
const labels={navigation:'왼쪽 메뉴',request_context:'요청 정보',main_preview:'큰 미리보기',block_library:'기능 목록',canvas:'작업 Canvas',property_panel:'설정 Panel',story_navigation:'항목 목록',component_preview:'실제 Preview',verification_panel:'검증 결과',component_library:'Component 목록',app_canvas:'앱 Canvas',settings_panel:'속성 설정',data_panel:'자료 Panel',build_canvas:'작업 Canvas',component_panel:'Component Panel'};
const propLabels={layout:'배치',spacing:'여백',color:'색상',typography:'글자',content:'문구',branding:'브랜드',motion:'움직임'};
let board,selectedRef=null,selectedRegions=[];const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),3200)}
function renderGallery(){ $('#gallery').innerHTML=board.references.map((r,i)=>`<article class="ref" data-ref="${esc(r.reference_id)}" tabindex="0"><div class="image"><img src="/reference-images/${esc(r.image_path)}" alt="${esc(r.name)} 실제 화면">${i===0?'<span class="baseline">현재 비교 기준</span>':''}</div><div class="info"><h2>${esc(r.name)}</h2><p>${esc(r.summary)}</p><div class="meta"><span>${esc(r.license_status)}</span><a href="${r.source_url.startsWith('http')?esc(r.source_url):'#'}" target="_blank" rel="noreferrer">출처 보기</a></div></div></article>`).join('') }
function renderInspector(){if(!selectedRef){$('#preview').innerHTML='';return}$('#pickTitle').textContent=selectedRef.name;$('#pickHelp').textContent='원하는 구역을 누르거나 전체 구조를 선택하세요.';$('#preview').innerHTML=`<img src="/reference-images/${esc(selectedRef.image_path)}" alt="${esc(selectedRef.name)}">`+selectedRef.regions.map(r=>`<button class="region ${selectedRegions.includes(r.region_label)?'selected':''}" data-region="${esc(r.region_label)}" style="left:${r.normalized_bounds.x*100}%;top:${r.normalized_bounds.y*100}%;width:${r.normalized_bounds.width*100}%;height:${r.normalized_bounds.height*100}%"><span class="region-label">${esc(labels[r.region_label]||r.region_label)}</span></button>`).join('');$('#properties').innerHTML=Object.keys(propLabels).map(k=>`<label class="prop"><input type="checkbox" value="${k}" ${(k==='layout'||k==='spacing')?'checked':''} ${(k==='content'||k==='branding')?'disabled':''}>${propLabels[k]}</label>`).join('');['#whole','#clear','#save'].forEach(id=>$(id).disabled=false)}
function selectReference(id){selectedRef=board.references.find(r=>r.reference_id===id);selectedRegions=[];document.querySelectorAll('.ref').forEach(x=>x.classList.toggle('selected',x.dataset.ref===id));renderInspector()}
document.addEventListener('click',e=>{const card=e.target.closest('[data-ref]');if(card&&!e.target.closest('a')){selectReference(card.dataset.ref);return}const region=e.target.closest('[data-region]');if(region){const id=region.dataset.region;selectedRegions=selectedRegions.includes(id)?selectedRegions.filter(x=>x!==id):[...selectedRegions,id];renderInspector()}});
$('#whole').onclick=()=>{selectedRegions=selectedRef.regions.map(r=>r.region_label);renderInspector()};$('#clear').onclick=()=>{selectedRegions=[];renderInspector()};
$('#save').onclick=async()=>{if(!selectedRef||selectedRegions.length===0){toast('화면과 구역을 먼저 선택해주세요.');return}const selectedProperties=[...document.querySelectorAll('#properties input:checked')].map(x=>x.value);if(!selectedProperties.length){toast('가져올 속성을 하나 이상 선택해주세요.');return}const apply=Object.fromEntries(Object.keys(propLabels).map(k=>[k,selectedProperties.includes(k)]));const regions=selectedRef.regions.filter(r=>selectedRegions.includes(r.region_label));const payload={reference_id:selectedRef.reference_id,regions,selected_properties:selectedProperties,apply,comparison_context:board.comparison_context,status:'draft_not_applied'};const res=await fetch('/api/visual-companion/selection',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await res.json();if(!res.ok){toast(data.error||'저장하지 못했습니다.');return}toast('선택을 Draft로 저장했습니다. 제품은 변경되지 않았습니다.')};
fetch('/api/visual-companion').then(r=>r.json()).then(data=>{board=data;renderGallery()}).catch(()=>toast('실제 화면 자료를 불러오지 못했습니다.'));
</script></body></html>
