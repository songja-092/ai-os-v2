<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI OS V2 · PM2 프로젝트 결과 보드</title>
<style>
:root{--ink:#14251f;--muted:#60746b;--line:#bfd2ca;--accent:#00a86b;--soft:#e4f6ef;--danger:#c53e57}*{box-sizing:border-box}body{margin:0;background:#f8fbfa;color:var(--ink);font-family:Arial,"Noto Sans KR",sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:225px 1fr}.side{border-right:1px solid var(--line);padding:28px 16px;background:#f3faf7}.brand{display:block;color:var(--ink);font-size:22px;font-weight:800;padding:0 14px 28px;border-bottom:1px solid var(--line);text-decoration:none}.nav{display:grid;gap:8px;margin-top:20px}.nav a{padding:13px 14px;border-radius:8px;color:var(--ink);text-decoration:none}.nav a.active{background:#d8f2e8;color:#007d50;font-weight:800}.main{padding:28px;min-width:0}.top,.panel-head,.module-title,.feature-list li{display:flex;align-items:center;justify-content:space-between;gap:12px}.top{border-bottom:1px solid var(--line);padding-bottom:18px}.top h1,.intro h2{margin:0}.badge{padding:8px 11px;border:1px solid #73bea0;border-radius:20px;color:#007d50;background:#edf9f4;font-size:12px;font-weight:800}.intro{margin:24px 0 16px}.intro h2{margin-bottom:6px}.intro p{margin:0;color:var(--muted)}.layout{display:grid;grid-template-columns:360px minmax(0,1fr);gap:18px}.panel{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}.panel-head{padding:15px 17px;border-bottom:1px solid var(--line)}.panel-head h3{margin:0;font-size:16px}.status,.open-label{font-size:12px;color:#007d50;font-weight:800}.module-list{display:grid;gap:10px;padding:14px}.module-control{border:1px solid #c9d9d2;border-radius:9px;padding:13px;background:#fbfdfc;cursor:pointer}.module-control:hover{border-color:#4d9c7b}.module-control.selected{border:2px solid var(--accent);background:var(--soft);padding:12px}.module-control h4{margin:0 0 5px;font-size:15px}.module-meta{color:var(--muted);font-size:11px}.module-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:11px}.module-actions button,.restore{min-height:38px;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer;font-weight:700}.module-actions .danger{color:var(--danger)}.module-actions button:disabled{opacity:.4}.feature-panel{margin:0 14px 14px;border-top:1px solid var(--line);padding-top:14px}.feature-panel h4{margin:0 0 9px;font-size:14px}.feature-list{display:grid;gap:7px;margin:0;padding:0;list-style:none}.feature-list li{padding:9px 10px;border-radius:7px;background:#f5faf8;font-size:12px}.feature-state{color:#007d50;font-weight:800}.feature-state.fixture{color:#9a6500}.restore{width:calc(100% - 28px);margin:0 14px 14px;background:var(--accent);border-color:var(--accent);color:#fff}.notice{margin:0 14px 14px;padding:12px;border:1px solid #b7d8ca;border-radius:8px;background:#edf8f3;color:#365c4e;font-size:12px;line-height:1.5}.notice.error{border-color:#edb5be;background:#fff2f4;color:#8e2d3d}.slot{padding:14px;background:#eef5f2;min-height:650px}.module-view{border:1px solid #afc9be;border-radius:9px;background:#fff;overflow:hidden}.view-head{display:flex;justify-content:space-between;padding:11px 13px;border-bottom:1px solid #d2dfda}.view-head strong{font-size:13px}.view-head span,.core-proof{font-size:11px;color:var(--muted)}.module-view iframe{display:block;width:100%;height:590px;border:0;background:#fff}.fallback{min-height:590px;display:grid;place-items:center;text-align:center;padding:30px}.fallback p{color:var(--muted);max-width:440px;line-height:1.6}.core-proof{margin-top:13px;padding:12px 14px;border:1px solid #c9d9d2;border-radius:8px;background:#fff}@media(max-width:1050px){.app{grid-template-columns:1fr}.side{display:none}.layout{grid-template-columns:1fr}.main{padding:18px}}
</style></head><body><div class="app">
<aside class="side"><a class="brand" href="./pm2-workspace.html">AI OS V2</a><nav class="nav"><a href="./pm2-workspace.html">대시보드</a><a class="active" href="./pm2-module-test.html">프로젝트 결과</a></nav></aside>
<main class="main"><header class="top"><h1>PM2 · 프로젝트 결과 보드</h1><span class="badge">PM2 완료 · 잠금</span></header>
<section class="intro"><h2>목록에서 하나를 열어 확인하세요</h2><p>등록된 결과물은 여러 개여도 Preview는 선택한 하나만 표시합니다. 기능은 프로젝트별로 분리해 보여줍니다.</p></section>
<div class="layout"><section class="panel" aria-label="프로젝트 결과 목록"><div class="panel-head"><h3>프로젝트 결과</h3><span class="status" id="coreStatus">Core 연결 중</span></div><div class="module-list" id="moduleControls"></div><div class="feature-panel"><h4 id="featureTitle">사용 가능한 기능</h4><ul class="feature-list" id="featureList"></ul></div><button class="restore" id="restoreButton">처음 상태로 복원</button><div class="notice" id="notice">Core 상태를 불러오고 있습니다.</div></section>
<section class="panel" aria-label="선택한 Preview"><div class="panel-head"><h3 id="previewTitle">Preview</h3><span class="status" id="slotStatus">확인 중</span></div><div class="slot" id="slot"></div></section></div><div class="core-proof" id="coreProof">Core revision 확인 중</div></main></div>
<script>
const projectId='pdf-drawing-symbols',controls=document.getElementById('moduleControls'),slot=document.getElementById('slot'),notice=document.getElementById('notice'),coreStatus=document.getElementById('coreStatus'),slotStatus=document.getElementById('slotStatus'),coreProof=document.getElementById('coreProof'),previewTitle=document.getElementById('previewTitle'),featureTitle=document.getElementById('featureTitle'),featureList=document.getElementById('featureList');let state=null;
function allowed(action){return state&&state.allowed_actions.includes(action)}function label(module){return module.enabled?(module.failed?'오류 격리됨':'사용 가능'):'비활성'}function actionButton(text,action,module,extra=''){return `<button data-action="${action}" data-module-id="${module.module_id}" class="${extra}" ${!allowed(action)?'disabled':''}>${text}</button>`}function activeModule(){return state.modules.find(module=>module.module_id===state.active_module_id)||state.modules[0]}
function renderFeatures(module){featureTitle.textContent=`${module.display_name} 기능`;featureList.innerHTML=(module.features||[]).map(feature=>`<li><span>${feature.display_name}</span><span class="feature-state ${feature.status==='fixture_only'?'fixture':''}">${feature.status==='verified'?'검증됨':'시험용'}</span></li>`).join('')||'<li>등록된 기능이 없습니다.</li>'}
function render(){const selected=activeModule();controls.innerHTML=state.modules.map(module=>`<article class="module-control ${module.module_id===selected.module_id?'selected':''}" data-select-module="${module.module_id}" tabindex="0"><div class="module-title"><div><h4>${module.display_name}</h4><div class="module-meta">${label(module)} · ${module.module_version}</div></div><span class="open-label">${module.module_id===selected.module_id?'열림':'열기'}</span></div><div class="module-actions">${actionButton(module.enabled?'잠시 끄기':'다시 켜기',module.enabled?'module.disable':'module.enable',module)}${actionButton('오류 격리 시험','module.simulate_failure',module,'danger')}</div></article>`).join('');const available=selected.enabled&&!selected.failed;previewTitle.textContent=selected.display_name;slotStatus.textContent=available?'선택됨 · 사용 가능':label(selected);renderFeatures(selected);slot.innerHTML=`<article class="module-view" data-module-view="${selected.module_id}"><div class="view-head"><strong>${selected.display_name}</strong><span>${label(selected)}</span></div>${available?`<iframe title="${selected.display_name}" src="${selected.entry}"></iframe>`:`<div class="fallback"><div><strong>${selected.failed?'오류를 이 결과에만 격리했습니다.':'이 결과는 잠시 꺼져 있습니다.'}</strong><p>다른 프로젝트 결과는 계속 작동합니다. 목록에서 다른 결과를 열거나 처음 상태로 복원할 수 있습니다.</p></div></div>`}</article>`;coreStatus.textContent='Core 연결됨';coreProof.textContent=`Core state revision ${state.revision} · 선택 ${state.active_module_id} · 마지막 행동 ${state.last_action} · PM2 완료·잠금`;
controls.querySelectorAll('[data-select-module]').forEach(card=>{const select=()=>{const module=state.modules.find(item=>item.module_id===card.dataset.selectModule);if(module&&module.enabled&&!module.failed&&module.module_id!==state.active_module_id)sendAction('module.select',module.module_id).catch(showError)};card.addEventListener('click',event=>{if(!event.target.closest('button'))select()});card.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();select()}})});controls.querySelectorAll('button[data-action]').forEach(control=>control.addEventListener('click',event=>{event.stopPropagation();sendAction(control.dataset.action,control.dataset.moduleId).catch(showError)}))}
async function loadState(){const response=await fetch(`/api/pm2/ui-state?project_id=${encodeURIComponent(projectId)}`,{cache:'no-store'}),body=await response.json();if(!response.ok)throw new Error(body.error||'Core 상태를 불러오지 못했습니다.');state=body;render();notice.textContent='선택 상태와 활성 상태는 Core에 저장됩니다. Preview는 한 번에 하나만 엽니다.'}async function sendAction(action,moduleId){const response=await fetch('/api/pm2/ui-action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project_id:projectId,action,module_id:moduleId})}),body=await response.json();if(!response.ok)throw new Error(body.error||'Core가 행동을 거부했습니다.');state=body.state;render();notice.classList.remove('error');notice.textContent=body.message}function showError(error){notice.classList.add('error');notice.textContent=error.message;coreStatus.textContent='확인 필요'}document.getElementById('restoreButton').addEventListener('click',()=>sendAction('layout.restore',null).catch(showError));loadState().catch(showError);
</script></body></html>
