<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI OS V2 · 전자명함 전체 화면 확인</title>
  <style>
    :root{--ink:#121713;--muted:#667069;--line:#d8ddd9;--soft:#f5f6f2;--brand:#70dc00;--dark:#090b0a;--bg:#eceeea;--warn:#9a5b00}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}button,input{font:inherit}
    .shell{max-width:1540px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:18px}.top h1{font-size:30px;margin:0 0 6px}.top p{margin:0;color:var(--muted)}.status{padding:10px 14px;border-radius:999px;background:white;border:1px solid var(--line);font-weight:800;white-space:nowrap}
    .workspace{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(350px,.55fr);gap:16px}.panel{background:white;border:1px solid var(--line);border-radius:18px;overflow:hidden}.panel-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.panel-head strong{font-size:17px}.panel-head small{color:var(--muted)}
    .screens{display:grid;grid-template-columns:repeat(4,minmax(205px,1fr));gap:14px;padding:18px;background:#f5f6f3}.screen{min-height:560px;background:#fff;border:1px solid #d1d5d2;border-radius:14px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 12px 28px rgba(15,22,17,.07)}.screen-title{padding:12px 14px;border-bottom:1px solid var(--line);font-weight:900;font-size:13px}.screen-body{padding:18px;flex:1}.screen button{border:0;border-radius:8px;padding:11px;font-weight:900}.visual-target-body{padding:0;background:#080a09}.visual-target-image{display:block;width:100%;height:100%;object-fit:cover;object-position:top center}.portrait{height:192px;width:146px;margin:6px auto 15px;border-radius:12px;background:#f4f4f1;overflow:hidden;border:1px solid #d8ddd9;box-shadow:0 8px 20px rgba(15,22,17,.10)}.portrait img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 18%}.tag{color:#4f9e00;font-weight:900;font-size:12px}.copy{font-size:13px;line-height:1.7}.timeline{border-left:1px solid #aeb8b0;padding-left:13px;margin-top:14px}.timeline p{position:relative}.timeline p:before{content:"";position:absolute;width:7px;height:7px;background:#111;border-radius:50%;left:-17px;top:7px}.qr{width:194px;height:194px;margin:22px auto;background:#fff;border:1px solid #dfe3df;border-radius:14px;padding:12px;display:grid;place-items:center;box-shadow:0 8px 22px rgba(15,22,17,.08)}.qr img{display:block;width:100%;height:100%;object-fit:contain}.center{text-align:center}.cta{width:100%;background:#080a09;color:white;margin-top:18px}.success{width:74px;height:74px;border-radius:50%;background:var(--brand);margin:28px auto 16px;display:grid;place-items:center;font-size:38px;color:#102000}.contact-list{display:grid;gap:11px}.contact{padding:14px;border:1px solid var(--line);border-radius:10px}.contact b{display:block;margin-bottom:4px}.input-preview{display:grid;gap:10px}.input-preview div{padding:11px;border:1px solid var(--line);border-radius:8px;color:#4d5650}.crop{height:190px;background:#e8ebe8;display:grid;place-items:center;margin-bottom:14px}.crop-box{width:146px;height:168px;border:3px solid var(--brand);border-radius:10px;overflow:hidden}.crop-box img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 18%}.meaning{background:#f2f8ed;border:1px solid #c9e3b1;border-radius:10px;padding:10px;margin:10px 0 14px;font-size:12px;line-height:1.55}.swatches{display:flex;gap:9px;margin:16px 0}.swatches i{width:28px;height:28px;border-radius:50%;background:#111}.swatches i:first-child{background:var(--brand);outline:2px solid #4f9b00;outline-offset:2px}.order{display:grid;gap:8px}.order div{padding:9px;border:1px solid var(--line);border-radius:7px}.runtime-warning{background:#fff4dd;border:1px solid #e5bf72;color:#704500;border-radius:10px;padding:10px;margin:0 0 14px;font-size:12px;font-weight:800;line-height:1.5}.test-badge{position:absolute;top:46px;right:9px;background:#efffcf;color:#315c00;border:1px solid #a8d46c;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900}.complete .screen-body{padding:0}.completion-target{display:block;width:100%;height:100%;object-fit:cover;object-position:top center}
    .editor{padding:16px}.notice{background:#eff8e8;border:1px solid #b9dc9c;border-radius:12px;padding:12px;line-height:1.5;font-size:13px}.fixture{width:100%;margin:12px 0;border:0;border-radius:10px;background:var(--dark);color:white;padding:12px;font-weight:900;cursor:pointer}.fields{display:grid;gap:10px}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:5px}.row{display:flex;gap:6px}.field input{min-width:0;width:100%;padding:10px;border:1px solid var(--line);border-radius:8px}.save{min-width:52px;border:0;border-radius:8px;background:#e6ebe7;padding:0 11px;font-weight:900;cursor:pointer}.scope{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}.scope h2{font-size:15px;margin:0 0 8px}.scope ul{margin:0;padding-left:20px;font-size:13px;line-height:1.6}.missing{color:var(--warn)}.approval{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:14px}.primary,.secondary{border-radius:9px;padding:12px;font-weight:900;cursor:pointer}.primary{border:0;background:var(--brand);color:#081103}.secondary{border:1px solid var(--line);background:white}.primary:disabled{opacity:.35;cursor:not-allowed}.note,.error{font-size:12px;margin-top:9px;line-height:1.45}.note{color:var(--muted)}.error{color:#a12727}
    @media(max-width:1200px){.workspace{grid-template-columns:1fr}.screens{grid-template-columns:repeat(2,minmax(260px,1fr))}}@media(max-width:620px){.shell{padding:12px}.top{align-items:start;flex-direction:column}.screens{grid-template-columns:1fr}.screen{min-height:540px}.approval{grid-template-columns:1fr}.top h1{font-size:24px}}
  </style>
</head>
<body><main class="shell">
  <header class="top"><div><h1>전자명함 전체 화면 확인</h1><p>PM4에서 승인한 8개 화면 안에서 정보를 바꾸고 모든 결과를 함께 확인합니다.</p></div><div class="status" id="status">불러오는 중</div></header>
  <div class="workspace">
    <section class="panel"><div class="panel-head"><strong>전체 과정 9개 화면</strong><small>PM4 승인 화면 8개와 최종 완료 화면입니다.</small></div><div class="screens" id="screens"></div></section>
    <aside class="panel"><div class="panel-head"><strong>내 정보 편집</strong><small>PM5 제작 범위</small></div><div class="editor">
      <div class="notice">실제 개인정보 없이 먼저 시험할 수 있습니다. 테스트 정보는 제품에 적용되거나 외부로 전송되지 않습니다.</div>
      <button id="fixture" class="fixture">테스트 정보로 전체 화면 시험하기</button>
      <div class="fields" id="fields"></div>
      <div class="scope"><h2>아직 필요한 자료</h2><ul id="missing" class="missing"></ul></div>
      <div class="approval"><button id="approve" class="primary">이 범위로 제작 준비</button><button id="reopen" class="secondary">수정</button></div>
      <div class="note" id="note"></div><div class="error" id="error"></div>
    </div></aside>
  </div>
</main><script>
const requestId='pm5-electronic-business-card-intent-v1';
const labels={person_name:'이름',organization:'소속',job_title:'직책',portrait_asset:'사진 파일',phone:'전화번호',email:'이메일',kakao_or_social:'카카오톡·SNS 주소',website:'웹사이트',theme_color:'대표 색상',delivery_scope:'전달 형태'};
const required=new Set(['person_name','portrait_asset','phone','email','kakao_or_social','website']);let state;
const mainTargetSource='/pm4-artifacts/project-collector-mvp-v1/design-candidates/direction-2.png';
const portraitSource='/pm5-artifacts/electronic-business-card-v1/portrait-id-approved.png';
const qrSource='/pm5-artifacts/electronic-business-card-v1/qr-approved.png';
const completionTargetSource='/pm5-artifacts/electronic-business-card-v1/screen-9-completion-visual-target.png';
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
async function action(payload){const res=await fetch('/api/pm5/ui-action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({request_id:requestId,...payload})});const data=await res.json();if(!res.ok)throw new Error(data.error||'저장하지 못했습니다.');state=data.state;render()}
function data(){const a=state.answers||{};return{name:a.person_name||'이름을 입력하세요',org:a.organization||'소속을 입력하세요',role:a.job_title||'직책을 입력하세요',phone:a.phone||'전화번호',email:a.email||'이메일',social:a.kakao_or_social||'SNS 주소',web:a.website||'웹사이트',initial:(a.person_name||'?').slice(0,1)}}
function portrait(){return `<div class="portrait"><img src="${portraitSource}" alt="김하은 사회복지사 인물 사진"></div>`}
function screen(title,body,cls='',bodyClass=''){return `<article class="screen ${cls}"><div class="screen-title">${title}</div>${state.test_fixture_active?'<span class="test-badge">테스트 정보</span>':''}<div class="screen-body ${bodyClass}">${body}</div></article>`}
function renderScreens(){const d=data();document.getElementById('screens').innerHTML=[
screen('1. 메인 프로필',`<img class="visual-target-image" src="${mainTargetSource}" alt="승인된 메인 프로필 Visual Target">`,'','visual-target-body'),
screen('2. 소개 · 경력',`<h2>${esc(d.name)}</h2><p>${esc(d.role)}</p><span class="tag">사람을 잇고 가능성을 키웁니다</span><div class="copy"><h3>소개</h3><p>지역사회가 함께 성장할 수 있도록 필요한 사람과 자원을 연결합니다.</p><h3>주요 경력</h3><div class="timeline"><p>${esc(d.org)} · 현재</p><p>지역주민 상담과 프로그램 운영</p><p>사례관리와 자원 연계</p></div></div><button class="cta">1:1 상담 문의</button>`),
screen('3. QR · NFC 공유',`<div class="center"><p>내 명함을 간편하게 공유하세요</p><div class="qr"><img src="${qrSource}" alt="전자명함 QR 코드 전체"></div><b>NFC 태그에 휴대폰을 대세요</b></div><button class="cta">공유하기</button>`),
screen('4. 연락처 저장',`${portrait()}<div class="center"><h2>${esc(d.name)}</h2><p>${esc(d.role)}</p></div><div class="contact-list"><div class="contact">전화 · ${esc(d.phone)}</div><div class="contact">이메일 · ${esc(d.email)}</div></div><div class="success">✓</div><div class="center"><b>연락처가 저장됐습니다!</b></div>`),
screen('5. 외부 연결 상태',`<div class="contact-list"><div class="contact"><b>전화 연결 ✓</b>${esc(d.phone)}로 연결</div><div class="contact"><b>문자 보내기 ✓</b>메시지 앱을 엽니다</div><div class="contact"><b>이메일 보내기 ✓</b>${esc(d.email)}</div><div class="contact"><b>웹사이트</b>${esc(d.web)}</div></div><p class="copy">외부 앱이 없거나 연결할 수 없으면 이유와 다시 시도 방법을 표시합니다.</p>`),
screen('6. 내 정보 편집',`${portrait()}<div class="input-preview"><div>이름 · ${esc(d.name)}</div><div>직책 · ${esc(d.role)}</div><div>소속 · ${esc(d.org)}</div><div>전화 · ${esc(d.phone)}</div><div>이메일 · ${esc(d.email)}</div></div><button class="cta">저장</button>`),
screen('7. 사진 맞춤 · 위치 조정',`<div class="crop"><div class="crop-box"><img src="${portraitSource}" alt="사진 위치 조정 미리보기"></div></div><p class="tag">원본은 보존하고 화면에 보이는 위치만 조정합니다.</p><div class="contact-list"><div class="contact">반명함 · 상반신 · 전신 · 가로 사진 자동 판정</div><div class="contact">모바일·PC 위치 따로 저장</div><div class="contact">얼굴 자동 변형 안 함</div></div>`),
screen('8. 테마 · 행동 순서',`<div class="runtime-warning">현재는 제작 범위 확인 화면입니다. 색상 선택과 순서 변경 Runtime은 아직 연결되지 않았습니다.</div><b>대표 색상</b><div class="meaning">실제 구현에서는 선택한 색상이 메인 화면의 강조색과 주요 버튼에 함께 적용되어야 합니다.</div><div class="swatches"><i></i><i></i><i></i><i></i><i></i></div><b>연락 버튼 표시 순서</b><div class="meaning">실제 구현에서는 아래 순서를 직접 바꾸고 메인 화면에서 즉시 확인할 수 있어야 합니다.</div><div class="order"><div>1 · 연락처 저장</div><div>2 · 전화</div><div>3 · 문자</div><div>4 · 이메일</div><div>5 · 카카오톡</div><div>6 · 웹사이트</div><div>7 · QR · NFC</div></div>`),
screen('9. 최종 완료',`<img class="completion-target" src="${completionTargetSource}" alt="전자명함 최종 완료 Visual Target">`,'complete')
].join('')}
function render(){document.getElementById('status').textContent=state.approval.status==='approved'?'범위 승인됨':`준비 중 · 버전 ${state.intent_packet_version}`;renderScreens();document.getElementById('fields').innerHTML=Object.entries(labels).map(([key,label])=>`<div class="field"><label>${label}${required.has(key)?' · 필수':''}</label><div class="row"><input id="f-${key}" value="${esc(state.answers[key]||'')}"><button class="save" data-key="${key}">저장</button></div></div>`).join('');document.querySelectorAll('.save').forEach(b=>b.onclick=()=>run({action:'intent.answer.set',field:b.dataset.key,value:document.getElementById('f-'+b.dataset.key).value}));document.getElementById('missing').innerHTML=(state.missing_fields.length?state.missing_fields.map(k=>labels[k]):['필요한 자료가 모두 준비됐습니다.']).map(v=>`<li>${esc(v)}</li>`).join('');document.getElementById('approve').disabled=!state.scope_ready||state.approval.status==='approved';document.getElementById('note').textContent=state.scope_ready?'8개 화면을 확인한 뒤 승인하면 구현용 전달서만 생성됩니다. 실제 제품은 아직 바뀌지 않습니다.':'필수 자료가 준비될 때까지 구현 전달은 차단됩니다.'}
async function run(payload){try{document.getElementById('error').textContent='';await action(payload)}catch(e){document.getElementById('error').textContent=e.message}}
document.getElementById('fixture').onclick=()=>run({action:'fixture.apply'});document.getElementById('approve').onclick=()=>run({action:'scope.approve'});document.getElementById('reopen').onclick=()=>run({action:'scope.reopen'});
fetch('/api/pm5/ui-state?request_id='+requestId).then(r=>r.json()).then(data=>{state=data;render()}).catch(e=>document.getElementById('error').textContent=e.message);
</script></body></html>
