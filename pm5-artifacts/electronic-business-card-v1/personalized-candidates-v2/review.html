<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>전자명함 개인화 시안 5개</title><style>body{margin:0;background:#f3f2ee;color:#17201d;font-family:system-ui,"Noto Sans KR",sans-serif}main{max-width:1240px;margin:auto;padding:42px 22px 80px}h1{font-size:clamp(30px,5vw,54px);margin:0}.lead{color:#5e6965;max-width:720px;line-height:1.65}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-top:28px}.item{background:white;border:1px solid #d8ddda;border-radius:18px;overflow:hidden}.item.selected{outline:4px solid #177b70}.item img{display:block;width:100%;aspect-ratio:390/844;object-fit:cover}.meta{padding:15px}.meta b,.meta span{display:block}.meta span{font-size:13px;color:#68736f;margin:5px 0 12px}.meta button{width:100%;min-height:46px;border:0;border-radius:9px;background:#17302d;color:white;font-weight:800;cursor:pointer}.status{margin-top:18px;padding:14px;background:#e8f3ef;border-radius:10px}</style></head><body><main><h1>전자명함 개인화 시안 5개</h1><p class="lead">초반 승인 Reference와 동일 인물을 사용하되 실제 전자명함 기능을 유지한 방향만 등록했습니다. 선택은 제품에 자동 적용되지 않습니다.</p><div class="grid" id="grid"></div><p class="status" id="status">선택 전</p></main><script>const labels={'direction-1':['따뜻한 인물형','warm_human_trust'],'direction-2':['편집형 전문직','editorial_professional'],'direction-3':['지역사회 다큐','documentary_community'],'direction-4':['QR·NFC 기능형','nfc_object_interface'],'direction-5':['문화적 프로필형','cultural_profile']};const grid=document.querySelector('#grid'),status=document.querySelector('#status');async function load(){const r=await fetch('/api/electronic-card/ui-state?request_id=electronic-card-product-v1',{cache:'no-store'}),s=await r.json(),run=s.personalized_candidate_run;grid.innerHTML=run.outputs.map(x=>`<article class="item ${run.selected_candidate_id===x.candidate_id?'selected':''}"><img src="/electronic-card-personalized-candidates/${x.candidate_id}.png" alt="${labels[x.candidate_id][0]} 시안"><div class="meta"><b>${labels[x.candidate_id][0]}</b><span>${labels[x.candidate_id][1]}</span><button data-id="${x.candidate_id}">이 방향 선택</button></div></article>`).join('');status.textContent=run.selected_candidate_id?`${labels[run.selected_candidate_id][0]} 선택 저장됨`:'선택 전';grid.onclick=async e=>{const b=e.target.closest('[data-id]');if(!b)return;await fetch('/api/electronic-card/ui-action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({request_id:'electronic-card-product-v1',action:'candidate.select',candidate_id:b.dataset.id})});load()}}load()</script></body></html>
