schema_version: "1.0"
release:
  target: control_plane
  source_branch: main
  staging:
    mode: isolated_temporary_worktree
    status: passed
  production:
    target: github_main
    status: deployed
  restore:
    strategy: previous_git_commit
    required: true
    status: passed
  gates:
    - staging_rehearsal
    - user_production_approval
    - production_deploy
    - previous_version_restore
